# nfpm config → the .deb and .rpm for gilamonster-agent.
#
#   VERSION=0.4.0 nfpm pkg --config packaging/nfpm.yaml --packager deb --target dist/
#   VERSION=0.4.0 nfpm pkg --config packaging/nfpm.yaml --packager rpm --target dist/
#
# nfpm expands ${VERSION} from the environment. The release workflow
# (.github/workflows/release.yml, job `linux-packages`) extracts the built
# linux-x86_64 archive into ./staging/ and runs the two commands above.
name: gilamonster-agent
arch: amd64
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: "Shawn Hartsock <hartsock@users.noreply.github.com>"
description: |
  Gilamonster agent — the ambient agent cockpit built on the newt-agent airframe.
  Installs the `gila` CLI and the portable `gila-headless` evaluator.
  Bridge-less build: Python-backed command groups delegate to a `gila` from
  the Python gilabot package if one is on PATH.
vendor: "Gilamonster Foundation"
homepage: "https://github.com/Gilamonster-Foundation/gilamonster-agent"
license: "Apache-2.0"
contents:
  - src: ./staging/gila
    dst: /usr/bin/gila
    file_info:
      mode: 0755
  - src: ./staging/gila-headless
    dst: /usr/bin/gila-headless
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/gilamonster-agent/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/gilamonster-agent/README.md
