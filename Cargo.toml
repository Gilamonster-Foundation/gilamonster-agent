[package]
name = "gilamonster-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "The Gilamonster agent matrix — inherits newt-agent's chat + agentic-coding airframe and extends it into a Hermes/Thoon-style multi-agent matrix."
repository = "https://github.com/Gilamonster-Foundation/gilamonster-agent"
keywords = ["gilamonster", "agent", "matrix", "ocap", "coding-agent"]

[[bin]]
name = "gila"
path = "src/main.rs"

[dependencies]
# --- Inherited from newt-agent (the "airframe") -------------------------------
# gila is a PRIVATE binary, not a published library — so it consumes newt over a
# GIT dependency pinned to a newt-agent main rev, NOT a crates.io version dep.
# newt 0.6.x cannot publish `newt-core`/`newt-tui`/`newt-mcp-server` to crates.io
# while the agent-bridle stub-shell `[patch.crates-io]` git patch stands (brush
# git dep → crates.io forbids it; see reubeno/brush#1184 and newt-agent's
# docs/decisions/agent_bridle_publishing.md). A binary never needs crates.io, so
# the git-dep is the correct permanent shape, not a stopgap. For LOCAL dev a
# git-ignored `.cargo/config.toml` overlays these onto the local newt checkout
# (see .cargo/config.toml.template); CI uses the pinned `rev` below.
#
# newt-tui pulls the lean chat + agentic-coding TUI (and, transitively,
# newt-core / newt-inference / newt-tools / newt-skills / newt-mcp-client).
# gilamonster reuses it directly and will extend it; "inherits and extends" is a
# git dependency on a sibling repo, not a fork.
newt-tui = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "d7842ab6c4201e0fa10d7b435486f2583a44f5b7" }
# The cowork foundation (newt PR #310 / issue #308): the redaction-gated
# `ShellObservation` seam, the non-blocking `TurnDriver` (submit_observation /
# submit / poll / cancel), and `transcript_lines`. `gila follow` consumes these
# directly to build the shared shell-observation channel — the agent side is
# built once in newt-core, gila only feeds it. The attenuation-only `Caveats`
# lattice (re-exported from newt-core) is what clamps follow to a read-only
# posture. Same pinned rev as the rest of the airframe.
newt-core = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "d7842ab6c4201e0fa10d7b435486f2583a44f5b7" }
# The object-capability identity layer — signed, attenuation-only AgentKey
# caveats. Shared with newt so the whole matrix runs under one capability model.
newt-identity = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "d7842ab6c4201e0fa10d7b435486f2583a44f5b7" }

# --- Local ---------------------------------------------------------------------
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# `gila hotseat` serializes the composed session config (the operator's config
# overlaid with the read-only-triage preset, the hotseat mode, and the modulex
# stdio MCP entry) to a per-session file and points $NEWT_CONFIG at it. newt's
# `Config` is serde-shaped, so a single `toml::to_string` round-trips through
# newt's own loader — gila never reimplements config writing. Pinned to the
# version newt resolves transitively so the two halves agree on the serializer.
toml = "0.8"
# The rich-TUI surface lives HERE, not in newt: newt deliberately keeps its chat
# a plain scroller (docs/decisions/plain_scroller_tui.md) and exposes transcript
# render DATA only (newt_core::agentic::transcript_lines). gila is the rich-TUI
# home, so `gila cowork`'s split-pane app depends on ratatui/crossterm directly.
# Pinned to the same versions newt-tui resolves (it pulls them transitively) so
# the two halves agree on the crossterm backend types.
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
# CLI integration tests: run the real `gila` binary and assert on its output.
# Mirrors newt-agent's CLI test stack (assert_cmd + predicates). This is what
# covers `main()` + the `matrix` arm so the coverage gate holds without faking
# the inherited TUI launch (the only line left uncovered by design).
assert_cmd = "2"
predicates = "3"
# Shell-observation channel tests: a wiremock backend stands in for the
# inference endpoint so we can prove an observation reaches the turn driver (and
# that a secret in it never does), and tempfile gives each typescript-tail test
# its own throwaway `script -F` file. Mirrors newt-core's own driver/observation
# test stack so the seam is exercised the same way upstream exercises it.
wiremock = "0.6"
tempfile = "3"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# ── Temporary patch: agent-bridle → crates.io transition ──────────────────────
#
# REPLICATED VERBATIM from newt-agent's top-level Cargo.toml. newt-tui
# transitively depends on `agent-bridle = "0.1"` (a crates.io dep that is not yet
# published — it lands only after agent-bridle PR #21 merges and brush#1184
# unblocks the real confined shell). newt satisfies that registry dep from the
# stub-shell branch via this `[patch.crates-io]` block; because gila consumes
# newt over a git dep, gila's OWN dependency tree must carry the identical patch
# or `agent-bridle 0.1` won't resolve. Keep this byte-for-byte in sync with
# newt-agent's block — when newt deletes it (post-brush#1184 + agent-bridle
# 0.1.0 on crates.io), delete it here too.
# See: https://github.com/Gilamonster-Foundation/agent-bridle/issues/20

[patch.crates-io]
agent-bridle           = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/stub-shell" }
agent-bridle-core      = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/stub-shell" }
agent-bridle-tool-shell = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/stub-shell" }
agent-bridle-tool-web  = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/stub-shell" }
