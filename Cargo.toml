[package]
name = "gilamonster-agent"
# 0.4.0 opens the post-re-pin line (newt 0.8.0 airframe; ROADMAP.md
# "Renumbering note, 2026-07-29"). Ends the drift where the manifest sat at
# 0.1.0 while tags reached v0.3.3 — from here the manifest moves with the tag.
version = "0.4.0"
edition = "2021"
# 1.75 -> 1.88: follows newt-agent's honest-floor bump (its current lock needs
# 1.88 via darling 0.23 / instability 0.3.12 from the ratatui work).
rust-version = "1.88"
default-run = "gila"
license = "Apache-2.0"
description = "The Gilamonster agent matrix — inherits newt-agent's chat + agentic-coding airframe and extends it into a Hermes/Thoon-style multi-agent matrix."
repository = "https://github.com/Gilamonster-Foundation/gilamonster-agent"
keywords = ["gilamonster", "agent", "matrix", "ocap", "coding-agent"]

[features]
default = ["langchain", "native-git", "python-bridge"]
langchain = ["dep:langchain-rust"]
native-git = ["dep:git2"]
python-bridge = ["dep:pyo3"]
# Compile the Jupyter notebook execution + server-management tool
# (`src/gila_jupyter.rs`, surfaced as `gila jupyter …`). Off by default so the
# lean airframe build does not pull nbformat/reqwest/rand/argon2.
jupyter = ["dep:nbformat", "dep:reqwest", "dep:rand", "dep:argon2"]

[[bin]]
name = "gila"
path = "src/main.rs"

[[bin]]
name = "gila-headless"
path = "src/bin/gila-headless.rs"

[[bin]]
name = "newt-net-guard"
path = "src/bin/newt-net-guard.rs"

[dependencies]
# --- Inherited from newt-agent (the "airframe") -------------------------------
# gila is a PRIVATE binary, not a published library — so it consumes newt over a
# GIT dependency pinned to a newt-agent main rev, NOT a crates.io version dep.
# A binary never needs crates.io, so the git-dep is the correct *permanent*
# shape, not a stopgap. For LOCAL dev a git-ignored `.cargo/config.toml`
# overlays these onto the local newt checkout (see .cargo/config.toml.template);
# CI uses the pinned `rev` below. The rev is newt-agent 0.8.0-line main
# (2026-08-16); agent-bridle now resolves from crates.io (0.7.14, published) so
# the old stub-shell `[patch.crates-io]` mirror is gone on both sides.
#
# newt-tui pulls the lean chat + agentic-coding TUI (and, transitively,
# newt-core / newt-inference / newt-tools / newt-skills / newt-mcp-client).
# gilamonster reuses it directly and will extend it; "inherits and extends" is a
# git dependency on a sibling repo, not a fork.
newt-tui = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "a46d001430f4c3b9713fa5254beb9838a0777968" }
# The cowork foundation (newt PR #310 / issue #308): the redaction-gated
# `ShellObservation` seam, the non-blocking `TurnDriver` (submit_observation /
# submit / poll / cancel), and `transcript_lines`. `gila follow` consumes these
# directly to build the shared shell-observation channel — the agent side is
# built once in newt-core, gila only feeds it. The attenuation-only `Caveats`
# lattice (re-exported from newt-core) is what clamps follow to a read-only
# posture. Same pinned rev as the rest of the airframe.
newt-core = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "a46d001430f4c3b9713fa5254beb9838a0777968" }
# The object-capability identity layer — signed, attenuation-only AgentKey
# caveats. Shared with newt so the whole matrix runs under one capability model.
newt-identity = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "a46d001430f4c3b9713fa5254beb9838a0777968" }

# --- Local ---------------------------------------------------------------------
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# newt's MCP client — `gila capabilities check` connects to a capability's MCP
# server over the SAME stdio JSON-RPC transport the inherited TUI uses, so the
# check exercises the real path, not a re-implementation. Same pinned rev.
newt-mcp-client = { git = "https://github.com/Gilamonster-Foundation/newt-agent", rev = "a46d001430f4c3b9713fa5254beb9838a0777968" }
# `gila capabilities check` builds tool-call arguments and reads MCP results.
serde_json = "1"
sha2 = "0.10"
# The `~/.gila/capabilities.toml` selection manifest deserializes via serde
# derive (see `src/manifest.rs`); `toml` (below) is the format.
serde = { version = "1", features = ["derive"] }
# The object-capability leash. `gila capabilities run` spawns a manifest-confined
# capability through `agent_bridle_core::spawn_confined_subprocess` (Landlock +
# env-scrub, agent-bridle#56). Published on crates.io; pinned to the same 0.7.x
# line newt-core resolves (0.7.15) so the two halves agree on the gate types.
# `async-trait` is needed only to implement the trivial `Tool` that mints the
# spawn's `ToolContext` through the gate.
agent-bridle-core = "0.7"
async-trait = "0.1"
# `gila hotseat` serializes the composed session config (the operator's config
# overlaid with the read-only-triage preset, the hotseat mode, and the modulex
# stdio MCP entry) to a per-session file and points $NEWT_CONFIG at it. newt's
# `Config` is serde-shaped, so a single `toml::to_string` round-trips through
# newt's own loader — gila never reimplements config writing. Pinned to the
# version newt resolves transitively so the two halves agree on the serializer.
toml = "1.0"
# The rich-TUI surface lives HERE, not in newt: newt deliberately keeps its chat
# a plain scroller (docs/decisions/plain_scroller_tui.md) and exposes transcript
# render DATA only (newt_core::agentic::transcript_lines). gila is the rich-TUI
# home, so `gila cowork`'s split-pane app depends on ratatui/crossterm directly.
# Pinned to the same versions newt-tui resolves (it pulls them transitively) so
# the two halves agree on the crossterm backend types.
ratatui = "0.29"
crossterm = "0.28"
# --- PTY-hosted shell pane (#10, Tier B part 2) -------------------------------
# There is no pseudo-terminal in std and crossterm/ratatui only own the *host*
# terminal, not a spawned child's. `portable-pty` is the maintained, cross-
# platform PTY crate (the same one wezterm uses): it spawns the human's real
# `$SHELL` on a pty slave and hands back a master reader/writer + a resize
# handle. `vt100` is the companion terminal-state parser: it interprets the
# shell's raw output byte-stream (cursor moves, colours, scroll) into a screen
# grid we map onto ratatui cells. Both are the standard, well-worn choice for
# exactly this "host a real shell in a TUI pane" job; neither has a std
# equivalent.
portable-pty = "0.9"
vt100 = "0.15"
# --- LangChain experiment (`gila chain`) --------------------------------------
# The Rust LangChain port: prompt templates + chains + LLM clients. `gila chain`
# drives an LLMChain against the SAME newt backend config the rest of the
# airframe uses (endpoint/model/api-key come from `Config::resolve`, never from
# code). NOTE: upstream last published 2024-10 (4.6.0) — treat this as an
# exploration surface, not a foundation; the seam is one module (`src/chain.rs`)
# so it stays cheap to replace.
langchain-rust = { version = "4.6", optional = true }
# --- gila-parity Phase 1: Rust-native `gila git` ------------------------------
# `git2` (libgit2) backs the Rust-native `gila git commit` — staging the index
# and writing the commit object are pure-libgit2 operations with no subprocess.
# Profile *steps* in `gila git tend` still shell out to the `git` CLI exactly
# like the Python engine (git_service.py) does, so behavior matches gilabot
# 1:1 rather than re-implementing fetch/pull/push semantics in libgit2.
git2 = { version = "0.20", optional = true }
# `gila git tend` reads the operator's existing `git-tend.yaml` (the same file
# Python gilabot's gila-plugin-git-tend parses) — serde_yaml deserializes it so
# the Rust port is config-compatible with the deployed config on day one.
serde_yaml = "0.9"
# --- gila-parity Phase 2: in-process Python bridge (pyo3) ---------------------
# Operator decision (2026-08-12): pyo3 in-process embedding, NOT a vendored-venv
# subprocess. The high-complexity gilabot commands (confluence, jira, slack,
# mcp, assistant, doc, calendar, review, pagerduty) stay in Python and run
# *inside* this process — `gilabot.main()` reads sys.argv, so a vendored call
# is: prepare sys.path, set sys.argv=[cmd, args…], call main(). `auto-initialize`
# boots the interpreter on first GIL acquisition. BUILD-TIME: set
# PYO3_PYTHON=/Users/shartsock/venv/bin/python so pyo3 embeds the venv
# interpreter (the default `python3` pyenv shim lacks the gila-plugin-* pkgs).
pyo3 = { version = "0.28", features = ["auto-initialize"], optional = true }
# --- Jupyter notebook tooling (ported from newt-agent PR #1730) -------------
# Gila ports newt-agent's `newt-tools/src/jupyter.rs` into its own tree as
# `src/gila_jupyter.rs` (the extension point is a separate binary, not a
# plugin slot — so the jupyter surface lives HERE, not behind a newt rev bump).
# All four deps are `optional = true` and ride the `jupyter` feature below, so
# a default `cargo build` stays strictly free of jupyter-only deps.
nbformat = { version = "0.7", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"], optional = true }
rand = { version = "0.8", optional = true }
argon2 = { version = "0.5", optional = true }

[dev-dependencies]
# CLI integration tests: run the real `gila` binary and assert on its output.
# Mirrors newt-agent's CLI test stack (assert_cmd + predicates). This is what
# covers `main()` + the `matrix` arm so the coverage gate holds without faking
# the inherited TUI launch (the only line left uncovered by design).
assert_cmd = "2"
predicates = "3"
# Shell-observation channel tests: a wiremock backend stands in for the
# inference endpoint so we can prove an observation reaches the turn driver (and
# that a secret in it never does), and tempfile gives each typescript-tail test
# its own throwaway `script -F` file. Mirrors newt-core's own driver/observation
# test stack so the seam is exercised the same way upstream exercises it.
wiremock = "0.6"
tempfile = "3"
serde_json = "1"
# layout.rs (#50): property-based invariant suite for the tmux cell tree —
# after arbitrary split/close/resize sequences, the size invariant holds, no
# panes overlap, directional nav is total, and area is conserved.
proptest = "1"
# parity.rs: locate the Python reference CLI on PATH without picking up the
# Rust binary under test (cargo_bin gives us our own path to exclude).
which = "7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
