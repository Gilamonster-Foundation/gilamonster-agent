name: CI

# HOOK PARITY: the lint/test/coverage jobs are mirrored by .githooks/pre-push.
# When editing those, update the push hook to match.
# EXCEPTION: the `windows` job is CI-only — no local Windows dev box.
#
# Mirrored from newt-agent's CI (gila inherits newt's gate: fmt + clippy -D
# warnings + test + an 80% line-coverage floor). gila is a single-package crate
# that consumes newt over a git dependency, so the jobs target the package, not
# a workspace — the bar is identical. Every PR clears the same bar a human
# reviewer would set; this is the swarm training ground, the gate must be honest.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**", "step-*", "release/**"]
  pull_request:
    branches: ["main"]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: agent-bridle stub guard
        # PIPELINE PARITY: mirrors the pre-push hook. gila replicates newt's
        # [patch.crates-io] block (newt-tui transitively needs agent-bridle);
        # the patch MUST stay on the publishable `feat/stub-shell` branch. The
        # real brush shell (`main`) reintroduces the brush git dep and is a
        # dev-only override that must never reach a pushed branch.
        run: |
          if grep -Eq 'agent-bridle[a-z-]*[[:space:]]*= [{] git = "[^"]*agent-bridle", branch = "main"' Cargo.toml; then
            echo "::error::[patch.crates-io] points agent-bridle at 'main' (real brush shell) — switch it back to feat/stub-shell before pushing."
            exit 1
          fi
          echo "shell guard OK: agent-bridle patch is on the publishable stub branch."
      - name: fmt check
        if: always()
        run: cargo fmt --all -- --check
      - name: clippy
        # `if: always()` so a fmt failure can't mask a clippy failure: both
        # surface in one run.
        if: always()
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # --locked is intentionally absent: Cargo.lock is git-ignored for this
        # binary (the git-dep resolves per build). Lock staleness is irrelevant.
        run: cargo test

  coverage:
    name: Coverage (cargo-llvm-cov, >= 80% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The floor matches `just cov-ci`. Keep them in lock-step — PIPELINE
      # PARITY. gila inherits newt's 80% floor.
      #
      # Why we don't rely on cargo-llvm-cov's --fail-under-lines: newt-agent#100
      # caught it silently exit-0'ing on a sub-floor commit. We parse the TOTAL
      # line out of `report --summary-only` and gate in shell.
      - name: Generate coverage data (no report yet)
        run: cargo llvm-cov --no-report

      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Enforce coverage floor (>= 80% lines)
        env:
          COVERAGE_FLOOR: "80"
        run: |
          set -euo pipefail
          summary=$(cargo llvm-cov report --summary-only)
          echo "$summary"
          # TOTAL row: regions missed cov% funcs missed cov% lines missed cov% ...
          # Line coverage is the 10th column (3rd "Cover" column).
          line_cov=$(printf '%s\n' "$summary" \
            | awk '$1 == "TOTAL" { gsub("%", "", $10); print $10 }')
          if [ -z "${line_cov:-}" ]; then
            echo "::error::could not parse line coverage from cargo-llvm-cov summary"
            exit 1
          fi
          echo "measured line coverage: ${line_cov}% (floor: ${COVERAGE_FLOOR}%)"
          if awk -v cov="$line_cov" -v floor="$COVERAGE_FLOOR" \
               'BEGIN { exit !(cov + 0 < floor + 0) }'; then
            echo "::error::line coverage ${line_cov}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
          echo "coverage gate OK: ${line_cov}% >= ${COVERAGE_FLOOR}%"

      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows build + test
    runs-on: windows-latest
    # CI-ONLY job — not mirrored by .githooks/pre-push (no local Windows box).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        if: always()
        run: cargo test
