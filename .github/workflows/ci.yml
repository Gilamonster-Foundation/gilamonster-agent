name: CI

# HOOK PARITY: the lint/test/coverage jobs are mirrored by .githooks/pre-push.
# When editing those, update the push hook to match.
# EXCEPTIONS: the Windows/macOS OS lanes and top-level compatibility-pinned
# real-Jupyter profiles are
# CI-only; the hook runs their deterministic fixture coverage locally.
#
# Mirrored from newt-agent's CI (gila inherits newt's gate: fmt + clippy -D
# warnings + test + an 80% line-coverage floor). gila is a single-package crate
# that consumes newt over a git dependency, so the jobs target the package, not
# a workspace — the bar is identical. Every PR clears the same bar a human
# reviewer would set; this is the swarm training ground, the gate must be honest.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**", "step-*", "release/**"]
  pull_request:
    branches: ["main"]

# A branch push and its pull_request event share one group, so expensive
# Jupyter/coverage matrices do not run twice for superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # pyo3 links an interpreter at build time (Phase 2 in-process bridge). CI
  # has no operator venv, so point pyo3 at the setup-python interpreter; the
  # bridge tests self-skip when gilabot isn't importable from it.
  PYO3_PYTHON: ${{ github.workspace }}/ci-python/bin/python

jobs:
  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: provide PYO3_PYTHON target
        # pyo3 needs a real interpreter path; a bare python3 works for
        # building/linking (the bridge is runtime-gated, not build-gated).
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-python/bin"
          ln -sf "$(command -v python3)" "$GITHUB_WORKSPACE/ci-python/bin/python"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: agent-bridle stub guard
        # PIPELINE PARITY: mirrors the pre-push hook. gila replicates newt's
        # [patch.crates-io] block (newt-tui transitively needs agent-bridle);
        # the patch MUST stay on the publishable `feat/stub-shell` branch. The
        # real brush shell (`main`) reintroduces the brush git dep and is a
        # dev-only override that must never reach a pushed branch.
        run: |
          if grep -Eq 'agent-bridle[a-z-]*[[:space:]]*= [{] git = "[^"]*agent-bridle", branch = "main"' Cargo.toml; then
            echo "::error::[patch.crates-io] points agent-bridle at 'main' (real brush shell) — switch it back to feat/stub-shell before pushing."
            exit 1
          fi
          echo "shell guard OK: agent-bridle patch is on the publishable stub branch."
      - name: fmt check
        if: always()
        run: cargo fmt --all -- --check
      - name: clippy
        # `if: always()` so a fmt failure can't mask a clippy failure: both
        # surface in one run.
        if: always()
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy --features jupyter
        if: always()
        run: cargo clippy --all-targets --features jupyter -- -D warnings
      - name: clippy --features jupyter-test-fixture
        if: always()
        run: cargo clippy --all-targets --features jupyter-test-fixture -- -D warnings
      - name: Jupyter feature isolation
        if: always()
        run: cargo check --no-default-features --features jupyter
      - name: strict headless Jupyter fixture lint
        if: always()
        run: cargo clippy --no-default-features --features jupyter-test-fixture --all-targets -- -D warnings
      - name: headless dependency gate
        if: always()
        run: |
          cargo clippy --no-default-features --bin gila-headless -- -D warnings

  headless-portability:
    name: Headless portability (Debian 12)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    container: rust:1.88-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build portable evaluator binary
        run: cargo build --release --no-default-features --bin gila-headless
      - name: reject non-portable dynamic dependencies
        run: |
          if readelf -d target/release/gila-headless | grep NEEDED | grep -Eiq 'python|ssl|crypto|git2|ssh2'; then
            echo "::error::gila-headless gained a non-portable runtime dependency"
            exit 1
          fi
          target/release/gila-headless --version

  test:
    name: Rust tests
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: provide PYO3_PYTHON target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-python/bin"
          ln -sf "$(command -v python3)" "$GITHUB_WORKSPACE/ci-python/bin/python"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # --locked is intentionally absent: Cargo.lock is git-ignored for this
        # binary (the git-dep resolves per build). Lock staleness is irrelevant.
        run: cargo test
      - name: jupyter feature tests
        if: always()
        run: cargo test --features jupyter
      - name: jupyter test-fixture tests
        if: always()
        run: cargo test --features jupyter-test-fixture,native-git
      - name: headless Jupyter library tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --lib
      - name: headless Jupyter lifecycle tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_cross_process_lifecycle
      - name: headless Jupyter execute tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_jupyter_execute
      - name: headless Jupyter Pixi tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_jupyter_pixi_integration
      - name: native headless solve tests
        if: always()
        run: cargo test --no-default-features --test solve

  harbor-adapter:
    name: Harbor 0.20 adapter
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install pinned Harbor
        run: python -m pip install --disable-pip-version-check 'harbor==0.20.0'
      - name: test adapter
        env:
          PYTHONPATH: scripts/eval/harbor
        run: python -m unittest discover -s scripts/eval/harbor -p 'test_*.py'

  coverage:
    name: Coverage (cargo-llvm-cov, >= 80% lines)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: provide PYO3_PYTHON target
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-python/bin"
          ln -sf "$(command -v python3)" "$GITHUB_WORKSPACE/ci-python/bin/python"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The floor matches `just cov-ci`. Keep them in lock-step — PIPELINE
      # PARITY. gila inherits newt's 80% floor.
      #
      # Why we don't rely on cargo-llvm-cov's --fail-under-lines: newt-agent#100
      # caught it silently exit-0'ing on a sub-floor commit. We parse the TOTAL
      # line out of `report --summary-only` and gate in shell.
      - name: Generate coverage data (no report yet)
        run: cargo llvm-cov --features jupyter-test-fixture,native-git --no-report

      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Enforce coverage floor (>= 80% lines)
        env:
          COVERAGE_FLOOR: "80"
        run: |
          set -euo pipefail
          summary=$(cargo llvm-cov report --summary-only)
          echo "$summary"
          # TOTAL row: regions missed cov% funcs missed cov% lines missed cov% ...
          # Line coverage is the 10th column (3rd "Cover" column).
          line_cov=$(printf '%s\n' "$summary" \
            | awk '$1 == "TOTAL" { gsub("%", "", $10); print $10 }')
          if [ -z "${line_cov:-}" ]; then
            echo "::error::could not parse line coverage from cargo-llvm-cov summary"
            exit 1
          fi
          echo "measured line coverage: ${line_cov}% (floor: ${COVERAGE_FLOOR}%)"
          if awk -v cov="$line_cov" -v floor="$COVERAGE_FLOOR" \
               'BEGIN { exit !(cov + 0 < floor + 0) }'; then
            echo "::error::line coverage ${line_cov}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
          echo "coverage gate OK: ${line_cov}% >= ${COVERAGE_FLOOR}%"

      - name: Upload lcov.info
        if: always()
        # Non-fatal: the coverage GATE is the step above; this upload is a
        # convenience report. An org-wide artifact-storage-quota hit (seen
        # 2026-07-29: "Failed to CreateArtifact: Artifact storage quota has
        # been hit") must not fail a job whose gate already passed.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows build + test
    runs-on: windows-latest
    timeout-minutes: 60
    # CI-ONLY job — not mirrored by .githooks/pre-push (no local Windows box).
    env:
      # Windows pyo3: point at setup-python's python.exe (no bin/ dir there).
      PYO3_PYTHON: ${{ github.workspace }}/ci-python/python.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: provide PYO3_PYTHON target
        run: |
          mkdir "$env:GITHUB_WORKSPACE/ci-python" -Force | Out-Null
          $py = (Get-Command python).Source
          Copy-Item $py "$env:GITHUB_WORKSPACE/ci-python/python.exe" -Force
        shell: pwsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy --features jupyter
        if: always()
        run: cargo clippy --all-targets --features jupyter -- -D warnings
      - name: clippy --features jupyter-test-fixture
        if: always()
        run: cargo clippy --all-targets --features jupyter-test-fixture -- -D warnings
      - name: Jupyter feature isolation
        if: always()
        run: cargo check --no-default-features --features jupyter
      - name: strict headless Jupyter fixture lint
        if: always()
        run: cargo clippy --no-default-features --features jupyter-test-fixture --all-targets -- -D warnings
      - name: headless dependency gate
        if: always()
        run: cargo clippy --no-default-features --bin gila-headless -- -D warnings
      - name: cargo test
        if: always()
        run: cargo test
      - name: jupyter feature tests
        if: always()
        run: cargo test --features jupyter
      - name: jupyter test-fixture tests
        if: always()
        run: cargo test --features jupyter-test-fixture,native-git
      - name: headless Jupyter library tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --lib
      - name: headless Jupyter lifecycle tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_cross_process_lifecycle
      - name: headless Jupyter execute tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_jupyter_execute
      - name: headless Jupyter Pixi tests
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_jupyter_pixi_integration
      - name: Windows private ACL and replacement behavior
        if: always()
        run: cargo test --no-default-features --features jupyter-test-fixture --lib durable_log_tests::windows_ -- --nocapture
      - name: native headless solve tests
        if: always()
        run: cargo test --no-default-features --test solve

  macos-jupyter:
    name: macOS Jupyter process lifecycle
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-jupyter
      - name: Jupyter feature isolation
        run: cargo check --no-default-features --features jupyter
      - name: strict fixture lint
        run: cargo clippy --no-default-features --features jupyter-test-fixture --all-targets -- -D warnings
      - name: process-tree and lifecycle behavior
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_cross_process_lifecycle

  real-jupyter:
    name: Real Jupyter lifecycle (${{ matrix.profile }})
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Notebook 7 / Server 2
            packages: notebook==7.6.2 jupyter-server==2.20.0 traitlets==5.16.1
            runtime_prefix: jpserver-
            parser_regression: true
          - profile: Notebook 6 / Server 1
            packages: notebook==6.5.7 jupyter-server==1.24.0 traitlets==5.9.0
            runtime_prefix: nbserver-
            # Notebook 6 owns NotebookApp.ip directly; it has no deprecated
            # NotebookApp -> ServerApp migration to demonstrate.  The exact
            # Gila rejection table still runs for this profile, while
            # the migration regression is pinned to Notebook 7 / Server 2.
            parser_regression: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: real-jupyter-${{ matrix.runtime_prefix }}
      # These are top-level compatibility pins. Pip may still resolve patched
      # transitive dependencies, so they are not a deterministic full lock.
      - name: install top-level compatibility-pinned Jupyter profile
        run: python -m pip install --disable-pip-version-check ${{ matrix.packages }}
      - name: exact extra-argument rejection table
        run: cargo test --no-default-features --features jupyter-test-fixture --lib extra_argument_surface_rejects_traitlets_aliases_abbreviations_and_positionals
      - name: Traitlets deprecated-alias regression
        if: matrix.parser_regression
        env:
          GILA_REQUIRE_REAL_JUPYTER: "1"
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_cross_process_lifecycle real_traitlets_parser_demonstrates_deprecated_notebook_ip_alias_bypass
      - name: start, authenticate, status, and stop real Jupyter
        env:
          GILA_REQUIRE_REAL_JUPYTER_LIFECYCLE: "1"
          GILA_EXPECT_RUNTIME_PREFIX: ${{ matrix.runtime_prefix }}
        run: cargo test --no-default-features --features jupyter-test-fixture --test test_cross_process_lifecycle real_jupyter_lifecycle_uses_private_runtime_metadata
